version: '3.8'

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rutasur-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  mongodb:
    image: mongo:7.0
    container_name: rutasur-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s

  mongo-init:
    image: mongo:7.0
    container_name: rutasur-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      bash -c "mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongodb:27017\" }]
          });
        }
      '"

  simulador:
    build:
      context: .
      dockerfile: services/simulador/Dockerfile
    container_name: rutasur-simulador
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - PORT=3001
      - START_CONTINUOUS=false
    depends_on:
      kafka:
        condition: service_healthy

  proyector:
    build:
      context: .
      dockerfile: services/proyector/Dockerfile
    container_name: rutasur-proyector
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  notificaciones:
    build:
      context: .
      dockerfile: services/notificaciones/Dockerfile
    container_name: rutasur-notificaciones
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  reprogramacion:
    build:
      context: .
      dockerfile: services/reprogramacion/Dockerfile
    container_name: rutasur-reprogramacion
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  monitor-sla:
    build:
      context: .
      dockerfile: services/monitor-sla/Dockerfile
    container_name: rutasur-monitor-sla
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
      - ACCELERATION_FACTOR=120
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  analitica:
    build:
      context: .
      dockerfile: services/analitica/Dockerfile
    container_name: rutasur-analitica
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
      - PORT=3002
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rutasur-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/rutasur?replicaSet=rs0&directConnection=true
      - SIMULADOR_URL=http://simulador:3001
      - ANALITICA_URL=http://analitica:3002
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      simulador:
        condition: service_started
      analitica:
        condition: service_started

volumes:
  mongo_data:
